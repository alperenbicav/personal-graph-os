[project]
name = "personal-graph-os"
version = "0.1.0"
description = "Local-first, graph-first personal workspace: typed objects and relationships as canonical data, with canvas/table/Kanban/timeline/search as projections."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "mcp>=1.9",
]

[project.scripts]
pgos-backup = "personal_graph_os.backup.cli:main"
pgos-token = "personal_graph_os.api.credentials_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_graph_os"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is idiomatically expressed as a call in an argument
# default (`Depends(...)`); it is resolved once per request, not at import time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
